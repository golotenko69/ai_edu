# Всё в контейнерах: платформа + Ollama + автоматическая загрузка модели.
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
# Модель меняется переменной AIEDU_LLM_MODEL (по умолчанию qwen2.5-coder:7b).
# Для GPU NVIDIA раскомментируйте блок deploy у сервиса ollama.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-nastavnik-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${AIEDU_LLM_MODEL:-qwen2.5-coder:7b}"]
    restart: "no"

  aiedu:
    depends_on: [ollama]
    environment:
      AIEDU_LLM_PROVIDER: openai
      AIEDU_LLM_BASE_URL: http://ollama:11434/v1
      AIEDU_OLLAMA_URL: http://ollama:11434/v1
      AIEDU_LLM_MODEL: ${AIEDU_LLM_MODEL:-qwen2.5-coder:7b}

volumes:
  ollama-models:
